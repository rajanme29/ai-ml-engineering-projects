#========================================================
# GitHub Actions CI-Pipeline for Flipkart Sentiment Analysis
#========================================================

name: CI - Flipkart Multiclass sentiment classification

#Triggered on PR against main and master branches
#Triggered on pushes to main and master branches

on:
    # run workflow after commits are pushed
    push:
        branches:
            - main
            - master
        paths:
            - "machine-learning/flipkart-sentiment-analysis/**"
            - ".github/workflows/flipkart-ci.yml"
    
    # run workflow when Pull Requests are created/updated
    pull_request:
        branches:
            - main
            - master
        paths:
            - "machine-learning/flipkart-sentiment-analysis/**"
            - ".github/workflows/flipkart-ci.yml"

    # manual execution from GitHub Actions
    workflow_dispatch:

defaults:
    run:
        working-directory: machine-learning/flipkart-sentiment-analysis

jobs:
    test-and-build-flipkart-api:
        runs-on: ubuntu-latest

        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            
            # Install Python runtime
            - name: Setup Python
              uses: actions/setup-python@v5
              with: 
                python-version: "3.11"
            
            # Upgrade pip manager
            - name: Upgrade pip
              run: |
                python -m pip install --upgrade pip
            
            # Install project dependencies
            - name: Install project dependencies
              run: |
                pip install -r requirements.txt

            # Build Docker image
            - name: Build docker image
              run: |
                docker build -t flipkart-sentiment-api .
            
            # Docker smoke test
            - name: Smoke test Uvicorn <=> Fastapi
              run: |
                docker run -d --name flipkart-sentiment-api-test -p 8000:8000 flipkart-sentiment-api
                sleep 15
                curl --fail http://localhost:8000/health
                curl -X POST http://localhost:8000/predict  -H "Content-Type: application/json"  -d '{"text":"Excellent Product"}'
                docker stop flipkart-sentiment-api-test
                docker rm flipkart-sentiment-api-test